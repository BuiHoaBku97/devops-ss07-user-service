name: CI User Service

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cartdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cartdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant permission for gradlew
        run: chmod +x gradlew

      - name: Run unit test
        env:
          CORE_DB_URL: jdbc:postgresql://localhost:5432/cartdb
          CORE_DB_USERNAME: postgres
          CORE_DB_PW: postgres
          CART_SERVICE_PORT: 8080
        run: ./gradlew test

      - name: Build jar
        run: ./gradlew bootJar -x test

      - name: upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: user-service-artifact
          path: build/libs/*-SNAPSHOT.jar
          retention-days: 3
